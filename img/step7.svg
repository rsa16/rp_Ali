<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Bacterial spots inoculated onto an ampicillin dilution series and the MIC read by visual inspection">
  <circle cx="160" cy="120" r="96" fill="#eef5f6" />
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- plate -->
    <ellipse cx="150" cy="140" rx="98" ry="62" fill="#f3f8f8" stroke="#17616e" stroke-width="5" />
    <ellipse cx="150" cy="136" rx="80" ry="48" fill="#efe7d2" stroke="#17616e" stroke-width="4" />
    <!-- sector labels -->
    <g font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#17616e" text-anchor="middle">
      <text x="90" y="122">0</text>
      <text x="128" y="118">2</text>
      <text x="168" y="118">4</text>
      <text x="206" y="122">8</text>
      <text x="90" y="176">16</text>
      <text x="128" y="184">32</text>
    </g>
    <!-- spots -->
    <g fill="#c8553d">
      <circle cx="90" cy="134" r="7" />
      <circle cx="128" cy="130" r="7" />
      <circle cx="168" cy="130" r="6" />
      <circle cx="206" cy="134" r="4.5" />
      <circle cx="90" cy="164" r="4" />
      <circle cx="128" cy="170" r="3.5" />
    </g>
    <!-- magnifier over clear spot (MIC) -->
    <circle cx="216" cy="146" r="30" fill="rgba(43,138,153,0.14)" stroke="#0e3b43" stroke-width="5" />
    <path d="M237 168 l22 22" stroke="#0e3b43" stroke-width="8" />
  </g>
  <text x="160" y="228" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#17616e">MIC = lowest [ampicillin] with no growth</text>
</svg>
