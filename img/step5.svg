<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Serial phage dilutions applied to mature biofilms">
  <circle cx="160" cy="120" r="96" fill="#eef5f6" />
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- serial dilution tubes -->
    <g>
      <rect x="34" y="70" width="26" height="92" rx="13" fill="#f3f8f8" stroke="#17616e" stroke-width="4" />
      <path d="M36 112 h22 v38 a11 11 0 0 1 -22 0 z" fill="#cfe3e6" />
      <circle cx="47" cy="128" r="2.6" fill="#17616e" />
      <circle cx="42" cy="138" r="2.2" fill="#17616e" />
      <circle cx="52" cy="140" r="2.2" fill="#17616e" />

      <rect x="72" y="80" width="26" height="82" rx="13" fill="#f3f8f8" stroke="#17616e" stroke-width="4" />
      <path d="M74 118 h22 v32 a11 11 0 0 1 -22 0 z" fill="#cfe3e6" />
      <circle cx="85" cy="132" r="2.4" fill="#17616e" />
      <circle cx="89" cy="140" r="2.2" fill="#17616e" />

      <rect x="110" y="92" width="26" height="70" rx="13" fill="#f3f8f8" stroke="#17616e" stroke-width="4" />
      <path d="M112 124 h22 v26 a11 11 0 0 1 -22 0 z" fill="#cfe3e6" />
      <circle cx="123" cy="136" r="2.4" fill="#17616e" />
    </g>
    <!-- arrow -->
    <path d="M156 130 h26" stroke="#e2a33b" stroke-width="6" />
    <path d="M178 122 l12 8 l-12 8 z" fill="#e2a33b" />
    <!-- plate receiving phage -->
    <ellipse cx="238" cy="158" rx="64" ry="40" fill="#f3f8f8" stroke="#17616e" stroke-width="5" />
    <ellipse cx="238" cy="154" rx="50" ry="30" fill="#efe7d2" stroke="#17616e" stroke-width="4" />
    <circle cx="220" cy="146" r="3" fill="#c8553d" />
    <circle cx="252" cy="150" r="3" fill="#c8553d" />
    <circle cx="236" cy="164" r="2.6" fill="#c8553d" />
    <!-- phage particles -->
    <g stroke="#17616e" stroke-width="2.4" fill="#2b8a99">
      <g transform="translate(206 106) scale(0.9)">
        <polygon points="0,-9 8,-4 8,4 0,9 -8,4 -8,-4" />
        <line x1="0" y1="9" x2="0" y2="16" />
        <path d="M-6 20 L0 16 L6 20" fill="none" />
      </g>
      <g transform="translate(226 100)">
        <polygon points="0,-9 8,-4 8,4 0,9 -8,4 -8,-4" />
        <line x1="0" y1="9" x2="0" y2="16" />
        <path d="M-6 20 L0 16 L6 20" fill="none" />
      </g>
    </g>
  </g>
  <text x="160" y="228" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#17616e">0 to 1 &#215; 10&#8313; PFU/mL</text>
</svg>
