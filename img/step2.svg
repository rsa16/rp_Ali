<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Molten Mueller-Hinton agar poured from a bottle into petri dishes">
  <circle cx="160" cy="120" r="96" fill="#eef5f6" />
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- bottle -->
    <g transform="rotate(38 130 96)">
      <rect x="112" y="34" width="36" height="96" rx="6" fill="#f3f8f8" stroke="#17616e" stroke-width="5" />
      <path d="M114 78 L146 78 L146 116 Q130 128 114 116 Z" fill="#e8c98f" stroke="#17616e" stroke-width="4" />
      <rect x="122" y="20" width="16" height="18" rx="4" fill="#17616e" />
      <rect x="116" y="14" width="28" height="10" rx="5" fill="#0e3b43" />
    </g>
    <!-- pouring stream -->
    <path d="M120 128 q-6 24 -18 40" stroke="#e8c98f" stroke-width="7" fill="none" />
    <!-- petri dish receiving -->
    <ellipse cx="118" cy="196" rx="52" ry="15" fill="#efe7d2" stroke="#17616e" stroke-width="5" />
    <ellipse cx="118" cy="190" rx="52" ry="15" fill="none" stroke="#17616e" stroke-width="5" />
    <!-- stack of plates -->
    <ellipse cx="228" cy="196" rx="50" ry="14" fill="#efe7d2" stroke="#17616e" stroke-width="5" />
    <ellipse cx="228" cy="184" rx="50" ry="14" fill="#f3f8f8" stroke="#17616e" stroke-width="5" />
    <ellipse cx="228" cy="172" rx="50" ry="14" fill="#efe7d2" stroke="#17616e" stroke-width="5" />
  </g>
</svg>
