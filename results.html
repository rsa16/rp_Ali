            <figcaption class="figure-caption results-caption mt-3 mb-0">
              The effect of sub-inhibitory bacteriophage T4 exposure on the
              minimum inhibitory concentration (MIC) of ampicillin in
              <em>Escherichia coli</em> biofilms. The x-axis represents the
              different phage concentrations in PFU/mL, and the y-axis
              represents the Mean MIC in μg/mL. Error bars represent &plusmn;1
              standard deviation. A trend in decreasing MIC is observed as Phage
              T4 concentration increases.
            </figcaption>
